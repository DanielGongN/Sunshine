---
# Standalone Windows build for forks.
#
# Upstream's ci.yml pulls in the whole LizardByte release pipeline (docker, flatpak,
# macos, coverage, signing, ...). This workflow only builds the Windows x64 binary
# with the same MSYS2/UCRT64 toolchain and produces a portable ZIP, so it can be run
# on a fork without any repository secrets.
name: Build-Windows

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: "windows-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows-AMD64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain

      - name: Setup NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 'lts/*'

      - name: Setup dotnet
        # cmake/packaging/windows_wix.cmake installs the WiX tool at configure time
        # whenever dotnet is found, so make sure a supported version is present.
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: '10.x'

      - name: NodeJS Path
        shell: pwsh
        run: |
          $NODEJS_PATH = Split-Path -Path (Get-Command node).Source -Parent
          "NODEJS_PATH=$NODEJS_PATH" >> $env:GITHUB_ENV

      - name: Configure
        env:
          # inherit the Windows PATH so that node/npm from setup-node is visible
          MSYS2_PATH_TYPE: inherit
          BRANCH: ${{ github.head_ref || github.ref_name }}
          # empty for branch builds (cmake falls back to the git branch),
          # set to the tag name for tag builds so the version stays clean
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail

          NODEJS_PATH=$(cygpath "$NODEJS_PATH")
          export PATH="$PATH:$NODEJS_PATH"

          cmake -B cmake-build-ci -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="${GITHUB_REPOSITORY_OWNER}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/${GITHUB_REPOSITORY}" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/${GITHUB_REPOSITORY}/issues" \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF

      - name: Build
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail

          NODEJS_PATH=$(cygpath "$NODEJS_PATH")
          export PATH="$PATH:$NODEJS_PATH"

          cmake --build cmake-build-ci --parallel 3

      - name: Package portable ZIP
        run: |
          set -euo pipefail

          mkdir -p artifacts
          cd cmake-build-ci
          cpack -G ZIP
          mv cpack_artifacts/Sunshine.zip ../artifacts/Sunshine-Windows-AMD64-portable.zip
          cd ..

          ls -lh artifacts/
          test -f artifacts/Sunshine-Windows-AMD64-portable.zip

      - name: Verify packaged runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @{
            'Sunshine/interception.dll' = 'interception.dll'
            'Sunshine/config/engine.conf' = 'engine.conf'
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            (Join-Path $PWD 'artifacts/Sunshine-Windows-AMD64-portable.zip'))
          try {
            foreach ($path in $files.Keys) {
              $entry = $archive.GetEntry($path)
              if ($null -eq $entry -or $entry.Length -eq 0) {
                throw "Missing or empty runtime file: $path"
              }
              $stream = $entry.Open()
              $sha256 = [System.Security.Cryptography.SHA256]::Create()
              try {
                $actualHash = [Convert]::ToHexString($sha256.ComputeHash($stream))
              } finally {
                $stream.Dispose()
                $sha256.Dispose()
              }
              $expectedHash = (Get-FileHash -LiteralPath $files[$path] -Algorithm SHA256).Hash
              if ($actualHash -ne $expectedHash) {
                throw "Packaged file differs from source: $path"
              }
              Write-Host "Verified $path"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Sunshine-Windows-AMD64
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: Sunshine-Windows-AMD64
          path: artifacts

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ls -lh artifacts/
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" \
                 --notes "Automated Windows build of ${GITHUB_REF_NAME}."
          gh release upload "${GITHUB_REF_NAME}" artifacts/*.zip --clobber
